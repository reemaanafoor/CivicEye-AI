<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CivicEye AI - Notifications</title>

    <style>
        :root {
            --text: #ffffff;
            --muted: rgba(255, 255, 255, 0.72);
            --card: rgba(255, 255, 255, 0.12);
            --border: rgba(255, 255, 255, 0.22);
            --shadow: rgba(0, 0, 0, 0.25);
        }

        body.light {
            --text: #182033;
            --muted: #596174;
            --card: rgba(255, 255, 255, 0.72);
            --border: rgba(0, 0, 0, 0.10);
            --shadow: rgba(0, 0, 0, 0.12);
        }

        body.dark {
            --text: #ffffff;
            --muted: rgba(255, 255, 255, 0.72);
            --card: rgba(255, 255, 255, 0.12);
            --border: rgba(255, 255, 255, 0.22);
            --shadow: rgba(0, 0, 0, 0.30);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);

            background:
                radial-gradient(
                    circle at top left,
                    rgba(106, 90, 249, 0.55),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(69, 199, 255, 0.45),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #6a5af9,
                    #45c7ff
                );

            transition: 0.3s ease;
        }

        body.light {
            background:
                radial-gradient(
                    circle at top left,
                    rgba(106, 90, 249, 0.25),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(69, 199, 255, 0.25),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #e7f8ff
                );
        }

        /* ==========================
           NAVBAR
        ========================== */

        .navbar {
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 28px;

            border-bottom: 1px solid var(--border);

            background: rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            position: sticky;
            top: 0;

            z-index: 1000;
        }

        .logo-area {
            display: flex;
            align-items: center;

            gap: 10px;

            font-size: 20px;
            font-weight: 700;
        }

        .logo {
            width: 38px;
            height: 38px;

            border-radius: 50%;

            object-fit: cover;
        }

        .nav-right {
            display: flex;
            align-items: center;

            gap: 18px;
        }

        .nav-link {
            color: var(--text);

            text-decoration: none;

            font-size: 15px;
            font-weight: 600;

            opacity: 0.9;

            transition: 0.2s ease;
        }

        .nav-link:hover {
            opacity: 1;
            transform: translateY(-1px);
        }

        .notification-link {
            display: flex;
            align-items: center;

            gap: 6px;

            position: relative;
        }

        /* ==========================
           BADGE
        ========================== */

        .notification-badge {
            display: none;

            align-items: center;
            justify-content: center;

            min-width: 19px;
            height: 19px;

            padding: 0 5px;

            border-radius: 20px;

            background: #ff4757;

            color: white;

            font-size: 11px;
            font-weight: 700;

            line-height: 1;
        }

        /* ==========================
           PAGE
        ========================== */

        .container {
            width: min(900px, calc(100% - 32px));

            margin: 45px auto;
        }

        .page-header {
            text-align: center;

            margin-bottom: 28px;
        }

        .page-header h1 {
            margin: 0 0 8px;

            font-size: 32px;
        }

        .page-header p {
            margin: 0;

            color: var(--muted);
        }

        /* ==========================
           ACTION BAR
        ========================== */

        .action-bar {
            display: flex;

            justify-content: flex-end;

            margin-bottom: 18px;
        }

        .read-all-btn {
            border: 1px solid var(--border);

            background: rgba(255, 255, 255, 0.12);

            color: var(--text);

            padding: 10px 16px;

            border-radius: 12px;

            cursor: pointer;

            font-weight: 600;

            transition: 0.2s ease;
        }

        .read-all-btn:hover {
            transform: translateY(-2px);

            background: rgba(255, 255, 255, 0.20);
        }

        .read-all-btn:disabled {
            opacity: 0.5;

            cursor: not-allowed;

            transform: none;
        }

        /* ==========================
           LIST
        ========================== */

        #notificationsList {
            display: flex;

            flex-direction: column;

            gap: 14px;
        }

        /* ==========================
           CARD
        ========================== */

        .notification-card {
            position: relative;

            padding: 18px 20px;

            border-radius: 18px;

            border: 1px solid var(--border);

            background: var(--card);

            box-shadow:
                0 10px 30px var(--shadow);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            transition: 0.25s ease;
        }

        .notification-card:hover {
            transform: translateY(-2px);
        }

        .notification-card.unread {
            border-left: 4px solid #45c7ff;
        }

        .notification-top {
            display: flex;

            align-items: flex-start;

            justify-content: space-between;

            gap: 15px;
        }

        .notification-title {
            margin: 0;

            font-size: 17px;

            font-weight: 700;
        }

        .notification-message {
            margin: 8px 0 0;

            color: var(--muted);

            line-height: 1.5;
        }

        .notification-time {
            margin-top: 12px;

            color: var(--muted);

            font-size: 12px;
        }

        .unread-dot {
            width: 9px;
            height: 9px;

            min-width: 9px;

            border-radius: 50%;

            background: #45c7ff;

            margin-top: 5px;
        }

        .read-btn {
            margin-top: 12px;

            border: 0;

            background: transparent;

            color: #45c7ff;

            cursor: pointer;

            font-size: 13px;

            font-weight: 700;

            padding: 0;
        }

        .read-btn:hover {
            text-decoration: underline;
        }

        /* ==========================
           EMPTY
        ========================== */

        .empty-state {
            text-align: center;

            padding: 55px 20px;

            border-radius: 20px;

            border: 1px solid var(--border);

            background: var(--card);

            box-shadow:
                0 10px 30px var(--shadow);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .empty-icon {
            font-size: 45px;

            margin-bottom: 12px;
        }

        .empty-state h2 {
            margin: 0 0 8px;
        }

        .empty-state p {
            margin: 0;

            color: var(--muted);
        }

        /* ==========================
           ERROR
        ========================== */

        .error-message {
            text-align: center;

            padding: 20px;

            border-radius: 16px;

            background: rgba(255, 71, 87, 0.15);

            border: 1px solid rgba(255, 71, 87, 0.35);

            color: var(--text);
        }

        /* ==========================
           MOBILE
        ========================== */

        @media (max-width: 700px) {

            .navbar {
                padding: 0 16px;
            }

            .logo-area {
                font-size: 17px;
            }

            .container {
                width: min(100% - 22px, 900px);

                margin: 30px auto;
            }

            .page-header h1 {
                font-size: 27px;
            }

            .notification-card {
                padding: 16px;
            }
        }
    </style>
</head>


<body>

    <!-- ==========================
         NAVBAR
    ========================== -->

    <nav class="navbar">

        <div class="logo-area">

            <img
                src="images/civiceye-logo.png"
                alt="CivicEye AI"
                class="logo"
            >

            <span>
                CivicEye AI
            </span>

        </div>


        <div class="nav-right">

            <a
                href="./citizen.html"
                class="nav-link"
            >
                <span data-i18n="home">
                    Home
                </span>
            </a>


            <a
                href="./notifications.html"
                class="nav-link notification-link"
            >

                <span data-i18n="notifications">
                    🔔 Notifications
                </span>

                <span
                    id="notificationBadge"
                    class="notification-badge"
                >
                    0
                </span>

            </a>

        </div>

    </nav>


    <!-- ==========================
         MAIN
    ========================== -->

    <main class="container">

        <div class="page-header">

            <h1 data-i18n="notificationTitle">
                🔔 Notifications
            </h1>

            <p data-i18n="notificationSubtitle">
                Stay updated about your reported issues.
            </p>

        </div>


        <div class="action-bar">

            <button
                id="markAllBtn"
                class="read-all-btn"
                onclick="markAllAsRead()"
            >
                ✓ Mark all as read
            </button>

        </div>


        <div id="notificationsList">

            <div class="empty-state">

                <div class="empty-icon">
                    ⏳
                </div>

                <h2 data-i18n="loading">
                    Loading...
                </h2>

                <p data-i18n="pleaseWait">
                    Please wait while we load your notifications.
                </p>

            </div>

        </div>

    </main>


    <script>

        /* ==========================
           BACKEND
        ========================== */

        const BACKEND_URL =
            "https://civiceye-backend-production-eac6.up.railway.app";


        /* ==========================
           TRANSLATIONS
        ========================== */

        const translations = {

            en: {
                home: "Home",
                notifications: "🔔 Notifications",
                notificationTitle: "🔔 Notifications",
                notificationSubtitle:
                    "Stay updated about your reported issues.",
                markAll:
                    "✓ Mark all as read",
                loading:
                    "Loading...",
                pleaseWait:
                    "Please wait while we load your notifications.",
                noNotifications:
                    "No notifications yet",
                noNotificationsText:
                    "You will see updates about your reported issues here.",
                unable:
                    "Unable to load notifications.",
                retry:
                    "Please try again later.",
                markRead:
                    "Mark as read"
            },

            ta: {
                home: "முகப்பு",
                notifications: "🔔 அறிவிப்புகள்",
                notificationTitle: "🔔 அறிவிப்புகள்",
                notificationSubtitle:
                    "உங்கள் புகார்களின் புதுப்பிப்புகளை அறிந்து கொள்ளுங்கள்.",
                markAll:
                    "✓ அனைத்தையும் படித்ததாக குறிக்கவும்",
                loading:
                    "ஏற்றுகிறது...",
                pleaseWait:
                    "உங்கள் அறிவிப்புகளை ஏற்றுகிறது.",
                noNotifications:
                    "அறிவிப்புகள் இல்லை",
                noNotificationsText:
                    "உங்கள் புகார்களின் புதுப்பிப்புகள் இங்கே காணப்படும்.",
                unable:
                    "அறிவிப்புகளை ஏற்ற முடியவில்லை.",
                retry:
                    "பின்னர் மீண்டும் முயற்சிக்கவும்.",
                markRead:
                    "படித்ததாக குறிக்கவும்"
            },

            si: {
                home: "මුල් පිටුව",
                notifications: "🔔 දැනුම්දීම්",
                notificationTitle: "🔔 දැනුම්දීම්",
                notificationSubtitle:
                    "ඔබ වාර්තා කළ ගැටලු පිළිබඳ යාවත්කාලීන ලබා ගන්න.",
                markAll:
                    "✓ සියල්ල කියවූ ලෙස සලකුණු කරන්න",
                loading:
                    "පූරණය වෙමින්...",
                pleaseWait:
                    "ඔබගේ දැනුම්දීම් පූරණය කරමින් පවතී.",
                noNotifications:
                    "දැනුම්දීම් නොමැත",
                noNotificationsText:
                    "ඔබගේ වාර්තා කළ ගැටලු පිළිබඳ යාවත්කාලීන මෙහි පෙන්වනු ඇත.",
                unable:
                    "දැනුම්දීම් පූරණය කළ නොහැක.",
                retry:
                    "පසුව නැවත උත්සාහ කරන්න.",
                markRead:
                    "කියවූ ලෙස සලකුණු කරන්න"
            }

        };


        /* ==========================
           LANGUAGE
        ========================== */

        function getLanguage() {

            const saved =
                localStorage.getItem(
                    "civicEyeLanguage"
                );

            if (
                saved === "ta" ||
                saved === "si"
            ) {
                return saved;
            }

            return "en";
        }


        function applyLanguage() {

            const language =
                getLanguage();

            const lang =
                translations[language];

            document.documentElement.lang =
                language;


            document
                .querySelectorAll("[data-i18n]")
                .forEach(element => {

                    const key =
                        element.getAttribute(
                            "data-i18n"
                        );

                    if (lang[key]) {
                        element.textContent =
                            lang[key];
                    }

                });


            const markAllBtn =
                document.getElementById(
                    "markAllBtn"
                );

            if (markAllBtn) {

                markAllBtn.textContent =
                    lang.markAll;

            }

        }


        /* ==========================
           CITIZEN EMAIL
        ========================== */

        function getCitizenEmail() {

            return (
                localStorage.getItem(
                    "civicEyeCitizenEmail"
                ) || ""
            );

        }


        /* ==========================
           SAFE HTML
        ========================== */

        function escapeHTML(value) {

            if (
                value === null ||
                value === undefined
            ) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* ==========================
           DATE
        ========================== */

        function formatDate(value) {

            if (!value) {
                return "";
            }

            const date =
                new Date(value);

            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {
                return "";
            }

            return date.toLocaleString();

        }


        /* ==========================
           READ STATUS
        ========================== */

        function isNotificationRead(
            notification
        ) {

            return (
                notification.read === true ||
                notification.isRead === true ||
                notification.read === 1 ||
                notification.isRead === 1
            );

        }


        /* ==========================
           LOAD BADGE
        ========================== */

        async function loadNotificationCount() {

            const badge =
                document.getElementById(
                    "notificationBadge"
                );

            if (!badge) {
                return;
            }


            const email =
                getCitizenEmail();


            if (!email) {

                badge.textContent = "0";

                badge.style.display =
                    "none";

                return;

            }


            try {

                const response =
                    await fetch(
                        `${BACKEND_URL}/notifications?email=${encodeURIComponent(email)}`,
                        {
                            method: "GET",

                            headers: {
                                "Accept":
                                    "application/json"
                            },

                            cache: "no-store"
                        }
                    );


                if (!response.ok) {
                    throw new Error(
                        `HTTP ${response.status}`
                    );
                }


                const data =
                    await response.json();


                let unread =
                    Number(
                        data.unread
                    );


                if (
                    !Number.isFinite(unread)
                ) {

                    const notifications =
                        Array.isArray(
                            data.notifications
                        )
                            ? data.notifications
                            : [];

                    unread =
                        notifications.filter(
                            notification =>
                                !isNotificationRead(
                                    notification
                                )
                        ).length;

                }


                if (unread > 0) {

                    badge.textContent =
                        unread > 99
                            ? "99+"
                            : String(unread);

                    badge.style.display =
                        "inline-flex";

                } else {

                    badge.textContent = "0";

                    badge.style.display =
                        "none";

                }

            } catch (error) {

                console.error(
                    "Notification badge error:",
                    error
                );

                badge.textContent = "0";

                badge.style.display =
                    "none";

            }

        }


        /* ==========================
           LOAD NOTIFICATIONS
        ========================== */

        async function loadNotifications() {

            const list =
                document.getElementById(
                    "notificationsList"
                );


            const email =
                getCitizenEmail();


            const language =
                getLanguage();

            const lang =
                translations[language];


            if (!email) {

                list.innerHTML = `

                    <div class="empty-state">

                        <div class="empty-icon">
                            🔔
                        </div>

                        <h2>
                            ${escapeHTML(
                                lang.noNotifications
                            )}
                        </h2>

                        <p>
                            ${escapeHTML(
                                lang.noNotificationsText
                            )}
                        </p>

                    </div>

                `;

                await loadNotificationCount();

                return;

            }


            try {

                const response =
                    await fetch(
                        `${BACKEND_URL}/notifications?email=${encodeURIComponent(email)}`,
                        {
                            method: "GET",

                            headers: {
                                "Accept":
                                    "application/json"
                            },

                            cache: "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                const data =
                    await response.json();


                const notifications =
                    Array.isArray(
                        data.notifications
                    )
                        ? data.notifications
                        : [];


                if (
                    notifications.length === 0
                ) {

                    list.innerHTML = `

                        <div class="empty-state">

                            <div class="empty-icon">
                                🔔
                            </div>

                            <h2>
                                ${escapeHTML(
                                    lang.noNotifications
                                )}
                            </h2>

                            <p>
                                ${escapeHTML(
                                    lang.noNotificationsText
                                )}
                            </p>

                        </div>

                    `;

                    await loadNotificationCount();

                    return;

                }


                list.innerHTML =
                    notifications
                        .map(notification => {

                            const id =
                                notification.id;

                            const title =
                                notification.title ||
                                notification.type ||
                                "CivicEye AI";

                            const message =
                                notification.message ||
                                "You have a new notification.";

                            const read =
                                isNotificationRead(
                                    notification
                                );

                            const createdAt =
                                notification.createdAt ||
                                notification.created_at ||
                                notification.timestamp ||
                                notification.date;


                            return `

                                <div
                                    class="notification-card ${read ? "" : "unread"}"
                                    data-id="${escapeHTML(id)}"
                                >

                                    <div class="notification-top">

                                        <div>

                                            <h3 class="notification-title">

                                                ${escapeHTML(
                                                    title
                                                )}

                                            </h3>


                                            <p class="notification-message">

                                                ${escapeHTML(
                                                    message
                                                )}

                                            </p>

                                        </div>


                                        ${
                                            !read
                                                ? `
                                                    <span
                                                        class="unread-dot"
                                                        title="Unread"
                                                    ></span>
                                                `
                                                : ""
                                        }

                                    </div>


                                    <div class="notification-time">

                                        ${escapeHTML(
                                            formatDate(
                                                createdAt
                                            )
                                        )}

                                    </div>


                                    ${
                                        !read
                                            ? `
                                                <button
                                                    type="button"
                                                    class="read-btn"
                                                    onclick="markAsRead('${escapeHTML(id)}')"
                                                >
                                                    ✓ ${escapeHTML(
                                                        lang.markRead
                                                    )}
                                                </button>
                                            `
                                            : ""
                                    }

                                </div>

                            `;

                        })
                        .join("");


                await loadNotificationCount();

            } catch (error) {

                console.error(
                    "Notification loading error:",
                    error
                );


                list.innerHTML = `

                    <div class="error-message">

                        <strong>
                            ${escapeHTML(
                                lang.unable
                            )}
                        </strong>

                        <br><br>

                        ${escapeHTML(
                            lang.retry
                        )}

                    </div>

                `;

            }

        }


        /* ==========================
           MARK ONE READ
        ========================== */

        async function markAsRead(
            notificationId
        ) {

            const email =
                getCitizenEmail();


            if (
                !email ||
                !notificationId
            ) {
                return;
            }


            try {

                const response =
                    await fetch(
                        `${BACKEND_URL}/notifications/${encodeURIComponent(notificationId)}/read`,
                        {
                            method: "PATCH",

                            headers: {
                                "Content-Type":
                                    "application/json",

                                "Accept":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    citizenEmail:
                                        email
                                })
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                await loadNotifications();

                await loadNotificationCount();


            } catch (error) {

                console.error(
                    "Mark notification read error:",
                    error
                );

            }

        }


        /* ==========================
           MARK ALL READ
        ========================== */

        async function markAllAsRead() {

            const email =
                getCitizenEmail();


            if (!email) {
                return;
            }


            const button =
                document.getElementById(
                    "markAllBtn"
                );


            try {

                button.disabled = true;


                const response =
                    await fetch(
                        `${BACKEND_URL}/notifications/read-all`,
                        {
                            method: "PATCH",

                            headers: {
                                "Content-Type":
                                    "application/json",

                                "Accept":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    citizenEmail:
                                        email
                                })
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                await loadNotifications();

                await loadNotificationCount();


            } catch (error) {

                console.error(
                    "Mark all notifications read error:",
                    error
                );

            } finally {

                button.disabled = false;

            }

        }


        /* ==========================
           THEME
        ========================== */

        function applyTheme() {

            const theme =
                localStorage.getItem(
                    "civicEyeTheme"
                ) || "default";


            document.body.classList.remove(
                "light",
                "dark"
            );


            if (theme === "light") {

                document.body.classList.add(
                    "light"
                );

            } else {

                document.body.classList.add(
                    "dark"
                );

            }

        }


        /* ==========================
           START
        ========================== */

        document.addEventListener(
            "DOMContentLoaded",
            async function () {

                applyTheme();

                applyLanguage();

                await loadNotifications();

                await loadNotificationCount();

            }
        );


        /* ==========================
           BADGE REFRESH
        ========================== */

        setInterval(
            loadNotificationCount,
            10000
        );


        /* ==========================
           NOTIFICATION REFRESH
        ========================== */

        setInterval(
            loadNotifications,
            30000
        );


        /* ==========================
           SYNC WITH SETTINGS
        ========================== */

        window.addEventListener(
            "storage",
            function (event) {

                if (
                    event.key ===
                        "civicEyeLanguage" ||

                    event.key ===
                        "civicEyeTheme" ||

                    event.key ===
                        "civicEyeCitizenEmail"
                ) {

                    applyTheme();

                    applyLanguage();

                    loadNotifications();

                    loadNotificationCount();

                }

            }
        );

    </script>

</body>

</html>
