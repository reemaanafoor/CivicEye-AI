<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CivicEye AI - Notifications</title>

    <!-- CivicEye AI Favicon -->
    <link
        rel="icon"
        type="image/png"
        href="images/civic-eye-logo.png"
    >

    <style>
        :root {
            --bg-1: #080b2a;
            --bg-2: #10195c;
            --text: #ffffff;
            --muted: rgba(255,255,255,0.72);
            --card: rgba(255,255,255,0.10);
            --card-border: rgba(255,255,255,0.16);
            --button: rgba(255,255,255,0.13);
            --button-hover: rgba(255,255,255,0.20);
            --danger: #ff4757;
            --success: #2ed573;
            --shadow: rgba(0,0,0,0.25);
        }

        body.light {
            --bg-1: #eef4ff;
            --bg-2: #dcecff;
            --text: #18213d;
            --muted: rgba(24,33,61,0.68);
            --card: rgba(255,255,255,0.72);
            --card-border: rgba(80,100,150,0.16);
            --button: rgba(80,100,150,0.10);
            --button-hover: rgba(80,100,150,0.16);
            --shadow: rgba(30,50,100,0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(106,90,249,0.35), transparent 35%),
                radial-gradient(circle at bottom right, rgba(69,199,255,0.25), transparent 35%),
                linear-gradient(135deg, var(--bg-1), var(--bg-2));
            transition: background 0.3s ease, color 0.3s ease;
        }

        .navbar {
            width: 100%;
            padding: 18px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--card-border);
            background: rgba(0,0,0,0.12);
            backdrop-filter: blur(18px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text);
            font-size: 20px;
            font-weight: 700;
        }

        .brand img {
            width: 38px;
            height: 38px;
            object-fit: contain;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .nav-links a {
            color: var(--text);
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            opacity: 0.9;
        }

        .nav-links a:hover {
            opacity: 1;
        }

        .notification-link {
            position: relative;
        }

        .notification-badge {
            display: none;
            position: absolute;
            top: -11px;
            right: -15px;
            min-width: 19px;
            height: 19px;
            padding: 0 5px;
            align-items: center;
            justify-content: center;
            border-radius: 50px;
            background: var(--danger);
            color: white;
            font-size: 11px;
            font-weight: 700;
            line-height: 1;
        }

        .container {
            width: min(1000px, 92%);
            margin: 55px auto;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 38px;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--muted);
            font-size: 16px;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .mark-all-btn {
            border: 1px solid var(--card-border);
            background: var(--button);
            color: var(--text);
            padding: 11px 17px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .mark-all-btn:hover {
            background: var(--button-hover);
            transform: translateY(-1px);
        }

        .notifications-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .notification-card {
            position: relative;
            padding: 20px;
            border-radius: 18px;
            border: 1px solid var(--card-border);
            background: var(--card);
            backdrop-filter: blur(18px);
            box-shadow: 0 10px 30px var(--shadow);
            transition: 0.2s ease;
        }

        .notification-card:hover {
            transform: translateY(-2px);
        }

        .notification-card.unread {
            border-left: 4px solid var(--danger);
        }

        .notification-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 15px;
        }

        .notification-content {
            flex: 1;
        }

        .notification-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .notification-message {
            color: var(--muted);
            line-height: 1.6;
            font-size: 14px;
        }

        .notification-time {
            color: var(--muted);
            font-size: 12px;
            margin-top: 12px;
        }

        .unread-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--danger);
            display: inline-block;
            margin-right: 7px;
        }

        .read-btn {
            border: 1px solid var(--card-border);
            background: var(--button);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
        }

        .read-btn:hover {
            background: var(--button-hover);
        }

        .empty-state,
        .error-state,
        .loading-state {
            text-align: center;
            padding: 65px 20px;
            border-radius: 22px;
            border: 1px solid var(--card-border);
            background: var(--card);
            backdrop-filter: blur(18px);
            box-shadow: 0 10px 30px var(--shadow);
        }

        .empty-icon,
        .error-icon,
        .loading-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .empty-state h2,
        .error-state h2,
        .loading-state h2 {
            font-size: 23px;
            margin-bottom: 8px;
        }

        .empty-state p,
        .error-state p,
        .loading-state p {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .retry-btn {
            margin-top: 18px;
            border: 0;
            padding: 10px 18px;
            border-radius: 10px;
            background: #6a5af9;
            color: white;
            cursor: pointer;
            font-weight: 600;
        }

        @media (max-width: 700px) {

            .navbar {
                padding: 15px 5%;
            }

            .brand {
                font-size: 17px;
            }

            .brand img {
                width: 32px;
                height: 32px;
            }

            .nav-links {
                gap: 15px;
            }

            .nav-links a {
                font-size: 13px;
            }

            .container {
                margin: 35px auto;
            }

            .header h1 {
                font-size: 30px;
            }

            .notification-top {
                flex-direction: column;
            }

            .read-btn {
                align-self: flex-start;
            }

            .actions {
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">

        <a href="./index.html" class="brand">
            <img
                src="images/civic-eye-logo.png"
                alt="CivicEye AI"
                onerror="this.style.display='none';"
            >
            <span>CivicEye AI</span>
        </a>

        <div class="nav-links">

            <a href="./index.html" data-i18n="home">
                Home
            </a>

            <a
                href="./notifications.html"
                class="notification-link"
            >
                <span data-i18n="notifications">
                    Notifications
                </span>

                <span
                    id="notificationBadge"
                    class="notification-badge"
                >
                    0
                </span>
            </a>

        </div>

    </nav>


    <!-- MAIN -->
    <main class="container">

        <section class="header">

            <div class="header-icon">
                🔔
            </div>

            <h1 data-i18n="notificationsTitle">
                Notifications
            </h1>

            <p data-i18n="notificationsSubtitle">
                Stay updated about your reported issues
            </p>

        </section>


        <div class="actions">

            <button
                id="markAllBtn"
                class="mark-all-btn"
                onclick="markAllAsRead()"
            >
                ✓
                <span data-i18n="markAll">
                    Mark all as read
                </span>
            </button>

        </div>


        <section
            id="notificationsList"
            class="notifications-list"
        >

            <div class="loading-state">

                <div class="loading-icon">
                    ⏳
                </div>

                <h2 data-i18n="loading">
                    Loading notifications...
                </h2>

            </div>

        </section>

    </main>


    <script>

        /* ==============================
           BACKEND
        ============================== */

        const BACKEND_URL =
            "https://civiceye-backend-production-eac6.up.railway.app";


        /* ==============================
           LANGUAGE
        ============================== */

        const translations = {

            en: {

                home: "Home",

                notifications: "Notifications",

                notificationsTitle: "Notifications",

                notificationsSubtitle:
                    "Stay updated about your reported issues",

                markAll:
                    "Mark all as read",

                loading:
                    "Loading notifications...",

                noNotifications:
                    "No notifications yet",

                noNotificationsText:
                    "You will see updates about your reported issues here",

                error:
                    "Unable to load notifications",

                errorText:
                    "Please check your connection and try again.",

                retry:
                    "Try again",

                markRead:
                    "Mark as read",

                allRead:
                    "All notifications marked as read"

            },

            ta: {

                home: "முகப்பு",

                notifications: "அறிவிப்புகள்",

                notificationsTitle:
                    "அறிவிப்புகள்",

                notificationsSubtitle:
                    "நீங்கள் பதிவு செய்த புகார்கள் குறித்த தகவல்களைப் பெறுங்கள்",

                markAll:
                    "அனைத்தையும் படித்ததாகக் குறிக்கவும்",

                loading:
                    "அறிவிப்புகள் ஏற்றப்படுகின்றன...",

                noNotifications:
                    "அறிவிப்புகள் எதுவும் இல்லை",

                noNotificationsText:
                    "உங்கள் புகார்களின் நிலை மாற்றங்கள் இங்கே காட்டப்படும்",

                error:
                    "அறிவிப்புகளை ஏற்ற முடியவில்லை",

                errorText:
                    "உங்கள் இணைய இணைப்பைச் சரிபார்த்து மீண்டும் முயற்சிக்கவும்.",

                retry:
                    "மீண்டும் முயற்சி",

                markRead:
                    "படித்ததாகக் குறிக்கவும்",

                allRead:
                    "அனைத்து அறிவிப்புகளும் படித்ததாகக் குறிக்கப்பட்டன"

            },

            si: {

                home: "මුල් පිටුව",

                notifications: "දැනුම්දීම්",

                notificationsTitle:
                    "දැනුම්දීම්",

                notificationsSubtitle:
                    "ඔබ වාර්තා කළ ගැටලු පිළිබඳ යාවත්කාලීන තොරතුරු ලබා ගන්න",

                markAll:
                    "සියල්ල කියවූ ලෙස සලකුණු කරන්න",

                loading:
                    "දැනුම්දීම් පූරණය වෙමින් පවතී...",

                noNotifications:
                    "තවම දැනුම්දීම් නොමැත",

                noNotificationsText:
                    "ඔබ වාර්තා කළ ගැටලු පිළිබඳ යාවත්කාලීන තොරතුරු මෙහි පෙන්වනු ඇත",

                error:
                    "දැනුම්දීම් පූරණය කළ නොහැක",

                errorText:
                    "ඔබගේ අන්තර්ජාල සම්බන්ධතාවය පරීක්ෂා කර නැවත උත්සාහ කරන්න.",

                retry:
                    "නැවත උත්සාහ කරන්න",

                markRead:
                    "කියවූ ලෙස සලකුණු කරන්න",

                allRead:
                    "සියලු දැනුම්දීම් කියවූ ලෙස සලකුණු කර ඇත"

            }

        };


        /* ==============================
           LOCAL STORAGE
        ============================== */

        function getCitizenEmail() {

            return (
                localStorage.getItem(
                    "civicEyeCitizenEmail"
                ) || ""
            );

        }


        function getLanguage() {

            return (
                localStorage.getItem(
                    "civicEyeLanguage"
                ) || "en"
            );

        }


        /* ==============================
           APPLY LANGUAGE
        ============================== */

        function applyLanguage() {

            const language =
                getLanguage();

            const dictionary =
                translations[language] ||
                translations.en;

            document.documentElement.lang =
                language;

            document
                .querySelectorAll("[data-i18n]")
                .forEach(element => {

                    const key =
                        element.getAttribute(
                            "data-i18n"
                        );

                    if (dictionary[key]) {

                        element.textContent =
                            dictionary[key];

                    }

                });

        }


        /* ==============================
           THEME
        ============================== */

        function applyTheme() {

            const theme =
                localStorage.getItem(
                    "civicEyeTheme"
                ) || "dark";

            document.body.classList.remove(
                "light"
            );

            if (theme === "light") {

                document.body.classList.add(
                    "light"
                );

            }

        }


        /* ==============================
           NOTIFICATION READ CHECK
           ============================== */

        function isNotificationRead(
            notification
        ) {

            return (
                notification.read === true ||
                notification.isRead === true ||
                notification.read === 1 ||
                notification.isRead === 1
            );

        }


        /* ==============================
           NOTIFICATION BADGE
           ============================== */

        async function loadNotificationCount() {

            const badge =
                document.getElementById(
                    "notificationBadge"
                );

            if (!badge) return;

            const email =
                getCitizenEmail();

            if (!email) {

                badge.textContent = "0";
                badge.style.display = "none";

                return;

            }

            try {

                const response =
                    await fetch(
                        `${BACKEND_URL}/notifications?email=${encodeURIComponent(email)}`,
                        {
                            method: "GET",
                            headers: {
                                "Accept":
                                    "application/json"
                            },
                            cache: "no-store"
                        }
                    );

                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }

                const data =
                    await response.json();

                let unreadCount =
                    Number(data.unread);

                if (!Number.isFinite(unreadCount)) {

                    unreadCount =
                        Array.isArray(
                            data.notifications
                        )
                            ? data.notifications.filter(
                                notification =>
                                    !isNotificationRead(
                                        notification
                                    )
                            ).length
                            : 0;

                }

                if (unreadCount > 0) {

                    badge.textContent =
                        unreadCount > 99
                            ? "99+"
                            : unreadCount;

                    badge.style.display =
                        "inline-flex";

                } else {

                    badge.textContent = "0";

                    badge.style.display =
                        "none";

                }

            } catch (error) {

                console.error(
                    "Notification count error:",
                    error
                );

                badge.style.display =
                    "none";

            }

        }


        /* ==============================
           LOAD NOTIFICATIONS
           ============================== */

        async function loadNotifications() {

            const list =
                document.getElementById(
                    "notificationsList"
                );

            const language =
                getLanguage();

            const dictionary =
                translations[language] ||
                translations.en;

            const email =
                getCitizenEmail();

            if (!email) {

                list.innerHTML = `

                    <div class="empty-state">

                        <div class="empty-icon">
                            🔔
                        </div>

                        <h2>
                            ${dictionary.noNotifications}
                        </h2>

                        <p>
                            ${dictionary.noNotificationsText}
                        </p>

                    </div>

                `;

                return;

            }

            try {

                const response =
                    await fetch(
                        `${BACKEND_URL}/notifications?email=${encodeURIComponent(email)}`,
                        {
                            method: "GET",
                            headers: {
                                "Accept":
                                    "application/json"
                            },
                            cache: "no-store"
                        }
                    );

                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }

                const data =
                    await response.json();

                const notifications =
                    Array.isArray(
                        data.notifications
                    )
                        ? data.notifications
                        : [];

                if (
                    notifications.length === 0
                ) {

                    list.innerHTML = `

                        <div class="empty-state">

                            <div class="empty-icon">
                                🔔
                            </div>

                            <h2>
                                ${dictionary.noNotifications}
                            </h2>

                            <p>
                                ${dictionary.noNotificationsText}
                            </p>

                        </div>

                    `;

                    return;

                }

                list.innerHTML =
                    notifications
                        .map(
                            notification =>
                                createNotificationHTML(
                                    notification,
                                    dictionary
                                )
                        )
                        .join("");

            } catch (error) {

                console.error(
                    "Notification loading error:",
                    error
                );

                list.innerHTML = `

                    <div class="error-state">

                        <div class="error-icon">
                            ⚠️
                        </div>

                        <h2>
                            ${dictionary.error}
                        </h2>

                        <p>
                            ${dictionary.errorText}
                        </p>

                        <button
                            class="retry-btn"
                            onclick="loadNotifications()"
                        >
                            ${dictionary.retry}
                        </button>

                    </div>

                `;

            }

        }


        /* ==============================
           CREATE NOTIFICATION CARD
           ============================== */

        function createNotificationHTML(
            notification,
            dictionary
        ) {

            const read =
                isNotificationRead(
                    notification
                );

            const title =
                escapeHTML(
                    notification.title ||
                    "CivicEye AI"
                );

            const message =
                escapeHTML(
                    notification.message ||
                    ""
                );

            const time =
                formatDate(
                    notification.createdAt ||
                    notification.timestamp ||
                    notification.date
                );

            return `

                <article
                    class="notification-card ${read ? "" : "unread"}"
                >

                    <div class="notification-top">

                        <div class="notification-content">

                            <div class="notification-title">

                                ${
                                    !read
                                        ? `<span class="unread-dot"></span>`
                                        : ""
                                }

                                ${title}

                            </div>

                            <div class="notification-message">
                                ${message}
                            </div>

                            ${
                                time
                                    ? `
                                    <div class="notification-time">
                                        ${time}
                                    </div>
                                    `
                                    : ""
                            }

                        </div>

                        ${
                            !read
                                ? `
                                    <button
                                        class="read-btn"
                                        onclick="markAsRead('${escapeAttribute(
                                            notification.id
                                        )}')"
                                    >
                                        ✓ ${dictionary.markRead}
                                    </button>
                                `
                                : ""
                        }

                    </div>

                </article>

            `;

        }


        /* ==============================
           MARK ONE AS READ
           ============================== */

        async function markAsRead(id) {

            const email =
                getCitizenEmail();

            if (!id || !email) return;

            try {

                const response =
                    await fetch(
                        `${BACKEND_URL}/notifications/${encodeURIComponent(id)}/read`,
                        {
                            method: "PATCH",

                            headers: {
                                "Content-Type":
                                    "application/json",
                                "Accept":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                citizenEmail: email
                            })
                        }
                    );

                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }

                await loadNotifications();

                await loadNotificationCount();

            } catch (error) {

                console.error(
                    "Mark notification read error:",
                    error
                );

            }

        }


        /* ==============================
           MARK ALL AS READ
           ============================== */

        async function markAllAsRead() {

            const email =
                getCitizenEmail();

            if (!email) return;

            try {

                const response =
                    await fetch(
                        `${BACKEND_URL}/notifications/read-all`,
                        {
                            method: "PATCH",

                            headers: {
                                "Content-Type":
                                    "application/json",
                                "Accept":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                citizenEmail: email
                            })
                        }
                    );

                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }

                await loadNotifications();

                await loadNotificationCount();

            } catch (error) {

                console.error(
                    "Mark all notifications error:",
                    error
                );

            }

        }


        /* ==============================
           DATE FORMAT
           ============================== */

        function formatDate(value) {

            if (!value) return "";

            const date =
                new Date(value);

            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return "";

            }

            return date.toLocaleString();

        }


        /* ==============================
           HTML SECURITY
           ============================== */

        function escapeHTML(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        function escapeAttribute(value) {

            return String(value)
                .replace(/\\/g, "\\\\")
                .replace(/'/g, "\\'");

        }


        /* ==============================
           STORAGE SYNC
           ============================== */

        window.addEventListener(
            "storage",
            function(event) {

                if (
                    event.key ===
                    "civicEyeLanguage"
                ) {

                    applyLanguage();
                    loadNotifications();

                }

                if (
                    event.key ===
                    "civicEyeTheme"
                ) {

                    applyTheme();

                }

                if (
                    event.key ===
                    "civicEyeCitizenEmail"
                ) {

                    loadNotifications();
                    loadNotificationCount();

                }

            }
        );


        /* ==============================
           INITIAL LOAD
           ============================== */

        applyTheme();

        applyLanguage();

        loadNotifications();

        loadNotificationCount();


        /* ==============================
           AUTO REFRESH
           ============================== */

        setInterval(
            loadNotificationCount,
            10000
        );

        setInterval(
            loadNotifications,
            30000
        );

    </script>

</body>

</html>
