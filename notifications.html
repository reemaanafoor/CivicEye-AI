<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CivicEye AI - Notifications</title>

<link rel="stylesheet" href="style.css">

<style>

/* =====================================================
   CIVICEYE THEME SUPPORT
===================================================== */

:root {
    --civic-text: #ffffff;
    --civic-card-bg: rgba(255,255,255,0.16);
    --civic-card-border: rgba(255,255,255,0.25);
    --civic-muted: rgba(255,255,255,0.75);
}

body {
    transition: background 0.3s ease, color 0.3s ease;
}

/* =====================================================
   NOTIFICATION PAGE
===================================================== */

.notifications-page {
    min-height: 100vh;
    padding: 110px 20px 50px;
}

.notifications-container {
    max-width: 900px;
    margin: 0 auto;
}

.notifications-header {
    text-align: center;
    margin-bottom: 30px;
}

.notifications-header h1 {
    margin: 0 0 8px;
    font-size: 32px;
    font-weight: 700;
    color: var(--civic-text);
}

.notifications-header p {
    margin: 0;
    color: var(--civic-muted);
}

/* =====================================================
   ACTION BAR
===================================================== */

.notification-actions {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 18px;
}

.mark-all-btn {
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.14);
    color: #fff;
    padding: 10px 16px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 14px;
    transition: 0.25s ease;
}

.mark-all-btn:hover {
    background: rgba(255,255,255,0.22);
    transform: translateY(-1px);
}

/* =====================================================
   NOTIFICATION CARD
===================================================== */

.notification-list {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.notification-card {
    position: relative;
    padding: 20px;
    border-radius: 18px;
    background: var(--civic-card-bg);
    border: 1px solid var(--civic-card-border);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    color: var(--civic-text);
    box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    transition: 0.25s ease;
}

.notification-card:hover {
    transform: translateY(-2px);
}

.notification-card.unread {
    border-left: 4px solid #45c7ff;
}

.notification-card.read {
    opacity: 0.72;
}

.notification-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 7px;
}

.notification-message {
    font-size: 14px;
    line-height: 1.6;
    color: var(--civic-muted);
    margin-bottom: 12px;
}

.notification-time {
    font-size: 12px;
    color: var(--civic-muted);
}

.notification-read-btn {
    position: absolute;
    right: 18px;
    top: 18px;

    border: none;
    background: rgba(255,255,255,0.12);
    color: #fff;

    padding: 7px 10px;
    border-radius: 9px;

    cursor: pointer;
    font-size: 12px;
}

.notification-read-btn:hover {
    background: rgba(255,255,255,0.22);
}

/* =====================================================
   EMPTY / LOADING / ERROR
===================================================== */

.notification-state {
    text-align: center;
    padding: 45px 20px;
    color: var(--civic-muted);
}

.notification-state .icon {
    font-size: 42px;
    margin-bottom: 12px;
}

.notification-state h3 {
    margin: 0 0 8px;
    color: var(--civic-text);
}

.notification-state p {
    margin: 0;
}

/* =====================================================
   DARK THEME
===================================================== */

body.dark-theme {
    background: #0f1220 !important;
}

body.dark-theme .notification-card {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.15);
}

/* =====================================================
   LIGHT THEME
===================================================== */

body.light-theme {
    color: #575454 !important;
}

body.light-theme .notification-card {
    background: rgba(255,255,255,0.82);
    border-color: rgba(0,0,0,0.08);
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}

body.light-theme .notifications-header h1,
body.light-theme .notification-title,
body.light-theme .notification-state h3 {
    color: #222;
}

body.light-theme .notifications-header p,
body.light-theme .notification-message,
body.light-theme .notification-time {
    color: #555;
}

body.light-theme .mark-all-btn,
body.light-theme .notification-read-btn {
    color: #222;
    background: rgba(0,0,0,0.06);
    border-color: rgba(0,0,0,0.08);
}

/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .notifications-page {
        padding: 95px 14px 35px;
    }

    .notifications-header h1 {
        font-size: 26px;
    }

    .notification-card {
        padding: 17px;
    }

    .notification-read-btn {
        position: static;
        margin-top: 10px;
    }
}

</style>
</head>

<body>

<!-- =====================================================
     NAVBAR
===================================================== -->

<nav>

    <h2>
        👁️ CivicEye AI
    </h2>

    <div>

    <div class="nav-right">

        <a href="citizen.html" class="nav-link">
            Citizen Portal
            <span
                id="notificationBadge"
                style="
                    display:none;
                    margin-left:6px;
                    background:#ff4757;
                    color:#fff;
                    font-size:11px;
                    padding:3px 7px;
                    border-radius:20px;
                "
            >
                0
            </span>
        </a>

        
    </div>

</nav>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="notifications-page">

    <div class="notifications-container">

        <div class="notifications-header">

            <h1 id="pageTitle">
                🔔 Notifications
            </h1>

            <p id="pageSubtitle">
                Stay updated with your CivicEye AI reports.
            </p>

        </div>


        <div class="notification-actions">

            <button
                id="markAllButton"
                class="mark-all-btn"
                type="button"
            >
                ✓ Mark All as Read
            </button>

        </div>


        <div
            id="notificationList"
            class="notification-list"
        >
        </div>

    </div>

</main>


<script>

/* =====================================================
   BACKEND
===================================================== */

const BACKEND_URL =
    "https://civiceye-backend-production-eac6.up.railway.app";


/* =====================================================
   LANGUAGE
===================================================== */

const translations = {

    en: {
        title: "🔔 Notifications",
        subtitle: "Stay updated with your CivicEye AI reports.",
        markAll: "✓ Mark All as Read",
        emptyTitle: "No Notifications",
        emptyText: "You don't have any notifications yet.",
        loading: "Loading notifications...",
        errorTitle: "Unable to Load Notifications",
        errorText: "Please try again later.",
        read: "✓ Read",
        newNotification: "New"
    },

    ta: {
        title: "🔔 அறிவிப்புகள்",
        subtitle: "உங்கள் CivicEye AI புகார்களின் புதுப்பிப்புகளைப் பாருங்கள்.",
        markAll: "✓ அனைத்தையும் படித்ததாகக் குறிக்கவும்",
        emptyTitle: "அறிவிப்புகள் இல்லை",
        emptyText: "இப்போது உங்களிடம் அறிவிப்புகள் எதுவும் இல்லை.",
        loading: "அறிவிப்புகள் ஏற்றப்படுகின்றன...",
        errorTitle: "அறிவிப்புகளை ஏற்ற முடியவில்லை",
        errorText: "சிறிது நேரம் கழித்து மீண்டும் முயற்சிக்கவும்.",
        read: "✓ படித்தது",
        newNotification: "புதியது"
    },

    si: {
        title: "🔔 දැනුම්දීම්",
        subtitle: "ඔබගේ CivicEye AI වාර්තා පිළිබඳ යාවත්කාලීන ලබාගන්න.",
        markAll: "✓ සියල්ල කියවූ ලෙස සලකුණු කරන්න",
        emptyTitle: "දැනුම්දීම් නැත",
        emptyText: "ඔබට තවම දැනුම්දීම් නොමැත.",
        loading: "දැනුම්දීම් පූරණය වෙමින්...",
        errorTitle: "දැනුම්දීම් පූරණය කළ නොහැක",
        errorText: "පසුව නැවත උත්සාහ කරන්න.",
        read: "✓ කියවා ඇත",
        newNotification: "නව"
    }

};


/* =====================================================
   GET LANGUAGE
===================================================== */

function getLanguage() {

    return (
        localStorage.getItem("civicEyeLanguage") ||
        sessionStorage.getItem("civicEyeLanguage") ||
        "en"
    );

}


/* =====================================================
   GET CITIZEN EMAIL
   IMPORTANT FIX:
   civicEyeCitizenEmail MUST BE FIRST
===================================================== */

function getCitizenEmail() {

    const keys = [

        "civicEyeCitizenEmail",

        "civicEyeEmail",

        "citizenEmail",

        "userEmail",

        "email"

    ];


    /* ---------- LOCAL STORAGE ---------- */

    for (const key of keys) {

        const value =
            localStorage.getItem(key);

        if (
            value &&
            value.trim()
        ) {

            return value
                .trim()
                .toLowerCase();

        }

    }


    /* ---------- SESSION STORAGE ---------- */

    for (const key of keys) {

        const value =
            sessionStorage.getItem(key);

        if (
            value &&
            value.trim()
        ) {

            return value
                .trim()
                .toLowerCase();

        }

    }


    /* ---------- USER OBJECTS ---------- */

    const userKeys = [

        "civicEyeUser",
        "citizenUser",
        "currentUser",
        "user"

    ];


    for (const key of userKeys) {

        try {

            const raw =
                localStorage.getItem(key);

            if (!raw) continue;

            const user =
                JSON.parse(raw);

            const email =
                user?.email ||
                user?.citizenEmail ||
                user?.civicEyeCitizenEmail;

            if (
                email &&
                String(email).trim()
            ) {

                return String(email)
                    .trim()
                    .toLowerCase();

            }

        } catch (error) {

            console.warn(
                "Unable to read user object:",
                key
            );

        }

    }


    return "";

}


/* =====================================================
   DATE FORMAT
===================================================== */

function formatDate(dateValue) {

    if (!dateValue) {
        return "";
    }

    const date =
        new Date(dateValue);

    if (Number.isNaN(date.getTime())) {
        return "";
    }

    return date.toLocaleString();

}


/* =====================================================
   FETCH NOTIFICATIONS
===================================================== */

async function fetchNotifications() {

    const email =
        getCitizenEmail();


    console.log(
        "📧 CivicEye notification email:",
        email
    );


    if (!email) {

        console.warn(
            "No citizen email found."
        );

        return [];

    }


    const response =
        await fetch(
            `${BACKEND_URL}/notifications?email=${encodeURIComponent(email)}`,
            {
                method: "GET",
                headers: {
                    "Accept": "application/json"
                }
            }
        );


    if (!response.ok) {

        throw new Error(
            `Notification request failed: ${response.status}`
        );

    }


    const data =
        await response.json();


    console.log(
        "🔔 Notification API response:",
        data
    );


    if (Array.isArray(data)) {
        return data;
    }


    if (
        data &&
        Array.isArray(data.notifications)
    ) {
        return data.notifications;
    }


    if (
        data &&
        Array.isArray(data.data)
    ) {
        return data.data;
    }


    if (
        data &&
        data.data &&
        Array.isArray(data.data.notifications)
    ) {
        return data.data.notifications;
    }


    return [];

}


/* =====================================================
   LOAD NOTIFICATIONS
===================================================== */

async function loadNotifications() {

    const list =
        document.getElementById(
            "notificationList"
        );

    const lang =
        getLanguage();

    const t =
        translations[lang] ||
        translations.en;


    list.innerHTML = `
        <div class="notification-state">
            <div class="icon">⏳</div>
            <h3>${t.loading}</h3>
        </div>
    `;


    try {

        const notifications =
            await fetchNotifications();


        if (
            !notifications ||
            notifications.length === 0
        ) {

            list.innerHTML = `
                <div class="notification-state">
                    <div class="icon">🔕</div>
                    <h3>${t.emptyTitle}</h3>
                    <p>${t.emptyText}</p>
                </div>
            `;

            updateBadge(0);

            return;

        }


        const unreadCount =
            notifications.filter(
                notification =>
                    notification.read === false
            ).length;


        updateBadge(unreadCount);


        list.innerHTML =
            notifications
                .map(
                    notification =>
                        createNotificationCard(
                            notification,
                            t
                        )
                )
                .join("");


    } catch (error) {

        console.error(
            "Notification loading error:",
            error
        );


        list.innerHTML = `
            <div class="notification-state">
                <div class="icon">⚠️</div>
                <h3>${t.errorTitle}</h3>
                <p>${t.errorText}</p>
            </div>
        `;

    }

}


/* =====================================================
   CREATE NOTIFICATION CARD
===================================================== */

function createNotificationCard(
    notification,
    t
) {

    const isRead =
        notification.read === true;


    const title =
        notification.title ||
        "CivicEye AI";


    const message =
        notification.message ||
        "";


    const time =
        formatDate(
            notification.createdAt
        );


    const id =
        notification.id;


    return `

        <div
            class="notification-card ${isRead ? "read" : "unread"}"
            data-id="${id}"
        >

            <div class="notification-title">
                ${escapeHtml(title)}
            </div>


            <div class="notification-message">
                ${escapeHtml(message)}
            </div>


            ${
                time
                    ? `
                        <div class="notification-time">
                            ${escapeHtml(time)}
                        </div>
                    `
                    : ""
            }


            ${
                !isRead
                    ? `
                        <button
                            class="notification-read-btn"
                            type="button"
                            onclick="markAsRead(${id}, this.closest('.notification-card'))"
                        >
                            ${t.read}
                        </button>
                    `
                    : ""
            }

        </div>

    `;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   MARK ONE AS READ
===================================================== */

async function markAsRead(
    notificationId,
    card
) {

    const email =
        getCitizenEmail();


    try {

        const response =
            await fetch(
                `${BACKEND_URL}/notifications/${notificationId}/read`,
                {
                    method: "PATCH",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body: JSON.stringify({
                        email: email
                    })
                }
            );


        if (!response.ok) {

            throw new Error(
                `Failed to mark notification as read: ${response.status}`
            );

        }


        if (card) {

            card.classList.remove(
                "unread"
            );

            card.classList.add(
                "read"
            );


            const button =
                card.querySelector(
                    ".notification-read-btn"
                );

            if (button) {
                button.remove();
            }

        }


        loadNotificationCount();


    } catch (error) {

        console.error(
            "Mark notification as read error:",
            error
        );

    }

}


/* =====================================================
   MARK ALL AS READ
===================================================== */

async function markAllAsRead() {

    const email =
        getCitizenEmail();


    if (!email) {
        return;
    }


    try {

        const response =
            await fetch(
                `${BACKEND_URL}/notifications/read-all`,
                {
                    method: "PATCH",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body: JSON.stringify({
                        email: email
                    })
                }
            );


        if (!response.ok) {

            throw new Error(
                `Failed to mark all as read: ${response.status}`
            );

        }


        await loadNotifications();


    } catch (error) {

        console.error(
            "Mark all notifications error:",
            error
        );

    }

}


/* =====================================================
   BADGE
===================================================== */

function updateBadge(count) {

    const badge =
        document.getElementById(
            "notificationBadge"
        );


    if (!badge) {
        return;
    }


    if (count > 0) {

        badge.textContent =
            count;

        badge.style.display =
            "inline-block";

    } else {

        badge.style.display =
            "none";

    }

}


/* =====================================================
   LOAD NOTIFICATION COUNT
===================================================== */

async function loadNotificationCount() {

    try {

        const notifications =
            await fetchNotifications();


        const unreadCount =
            notifications.filter(
                notification =>
                    notification.read === false
            ).length;


        updateBadge(
            unreadCount
        );


    } catch (error) {

        console.error(
            "Notification count error:",
            error
        );

    }

}


/* =====================================================
   APPLY LANGUAGE
===================================================== */

function applyLanguage() {

    const lang =
        getLanguage();

    const t =
        translations[lang] ||
        translations.en;


    const title =
        document.getElementById(
            "pageTitle"
        );

    const subtitle =
        document.getElementById(
            "pageSubtitle"
        );

    const markAllButton =
        document.getElementById(
            "markAllButton"
        );


    if (title) {
        title.textContent =
            t.title;
    }


    if (subtitle) {
        subtitle.textContent =
            t.subtitle;
    }


    if (markAllButton) {
        markAllButton.textContent =
            t.markAll;
    }

}


/* =====================================================
   THEME
===================================================== */

function applyTheme() {

    const theme =
        localStorage.getItem(
            "civicEyeTheme"
        ) ||
        "default";


    document.body.classList.remove(
        "light-theme",
        "dark-theme"
    );


    if (theme === "light") {

        document.body.classList.add(
            "light-theme"
        );

    }


    if (theme === "dark") {

        document.body.classList.add(
            "dark-theme"
        );

    }

}


/* =====================================================
   MARK ALL BUTTON
===================================================== */

document
    .getElementById("markAllButton")
    .addEventListener(
        "click",
        markAllAsRead
    );


/* =====================================================
   INITIALIZE
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    async () => {

        applyTheme();

        applyLanguage();

        await loadNotifications();

    }
);


/* =====================================================
   UPDATE IF SETTINGS CHANGE
===================================================== */

window.addEventListener(
    "storage",
    () => {

        applyTheme();

        applyLanguage();

        loadNotifications();

    }
);

</script>

</body>
</html>
