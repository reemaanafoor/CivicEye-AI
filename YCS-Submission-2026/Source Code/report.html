<script>

/* ==================================================
   THEME
   ================================================== */

(function () {

    const savedTheme =
        localStorage.getItem("civicEyeTheme") || "default";

    document.body.classList.remove(
        "theme-light",
        "theme-dark"
    );

    if (savedTheme === "light") {
        document.body.classList.add("theme-light");
    }

    if (savedTheme === "dark") {
        document.body.classList.add("theme-dark");
    }

})();

/* ==================================================
   MORE MENU
   ================================================== */

const moreMenuButton =
    document.getElementById("moreMenuButton");

const moreMenu =
    document.getElementById("moreMenu");

moreMenuButton.addEventListener("click", function(event) {

    event.stopPropagation();

    const isOpen =
        moreMenu.classList.toggle("show");

    moreMenuButton.setAttribute(
        "aria-expanded",
        isOpen ? "true" : "false"
    );

});

document.addEventListener("click", function(event) {

    if (
        !moreMenu.contains(event.target) &&
        !moreMenuButton.contains(event.target)
    ) {

        moreMenu.classList.remove("show");

        moreMenuButton.setAttribute(
            "aria-expanded",
            "false"
        );

    }

});

/* ==================================================
   MODALS
   ================================================== */

function showHelp() {

    document
        .getElementById("helpModal")
        .classList.add("show");

    moreMenu.classList.remove("show");

    moreMenuButton.setAttribute(
        "aria-expanded",
        "false"
    );

}

function showAbout() {

    document
        .getElementById("aboutModal")
        .classList.add("show");

    moreMenu.classList.remove("show");

    moreMenuButton.setAttribute(
        "aria-expanded",
        "false"
    );

}

function closeModal() {

    document
        .querySelectorAll(".civic-modal")
        .forEach(function(modal) {

            modal.classList.remove("show");

        });

}

function closeModalOutside(event) {

    if (
        event.target.classList.contains("civic-modal")
    ) {

        closeModal();

    }

}

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Escape") {

            closeModal();

            if (moreMenu) {

                moreMenu.classList.remove("show");

                moreMenuButton.setAttribute(
                    "aria-expanded",
                    "false"
                );

            }

        }

    }
);

/* ==================================================
   BACKEND
   ================================================== */

const BACKEND_URL =
    "https://civiceye-backend-production-eac6.up.railway.app";

/* ==================================================
   IMAGE PREVIEW
   ================================================== */

function previewImage(event) {

    const file =
        event.target.files[0];

    const preview =
        document.getElementById("imagePreview");

    const status =
        document.getElementById("imageStatus");

    preview.innerHTML = "";

    if (!file) {

        status.textContent = "";

        return;

    }

    const reader =
        new FileReader();

    reader.onload = function(e) {

        const img =
            document.createElement("img");

        img.src = e.target.result;

        img.style.maxWidth = "100%";
        img.style.maxHeight = "300px";
        img.style.marginTop = "12px";
        img.style.borderRadius = "12px";

        preview.appendChild(img);

        status.textContent =
            "✅ Image selected successfully.";

    };

    reader.readAsDataURL(file);

}

/* ==================================================
   LOCATION
   ================================================== */

function getCurrentLocation() {

    const locationInput =
        document.getElementById("location");

    const locationStatus =
        document.getElementById("locationStatus");

    if (!navigator.geolocation) {

        locationStatus.textContent =
            "❌ Geolocation is not supported.";

        return;

    }

    locationStatus.textContent =
        "📍 Getting your location...";

    navigator.geolocation.getCurrentPosition(

        function(position) {

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;

            locationInput.value =
                `${latitude}, ${longitude}`;

            locationStatus.textContent =
                "✅ Location detected successfully.";

        },

        function(error) {

            console.error(error);

            locationStatus.textContent =
                "❌ Unable to get your location. Please enter it manually.";

        }

    );

}

/* ==================================================
   VOICE COMPLAINT
   ================================================== */

let recognition = null;

let isRecording = false;

function startVoiceComplaint() {

    const voiceStatus =
        document.getElementById("voiceStatus");

    const language =
        document.getElementById("voiceLanguage").value;

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        voiceStatus.textContent =
            "❌ Voice recognition is not supported in this browser.";

        return;

    }

    if (isRecording && recognition) {

        recognition.stop();

        return;

    }

    recognition =
        new SpeechRecognition();

    recognition.lang =
        language;

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.onstart = function() {

        isRecording = true;

        voiceStatus.textContent =
            "🎤 Listening... Please speak.";

    };

    recognition.onresult = function(event) {

        const transcript =
            event.results[0][0].transcript;

        const description =
            document.getElementById("description");

        if (description.value.trim()) {

            description.value +=
                " " + transcript;

        } else {

            description.value =
                transcript;

        }

        voiceStatus.textContent =
            "✅ Voice complaint added.";

    };

    recognition.onerror = function(event) {

        console.error(
            "Voice recognition error:",
            event.error
        );

        voiceStatus.textContent =
            "❌ Voice recognition error.";

        isRecording = false;

    };

    recognition.onend = function() {

        isRecording = false;

    };

    recognition.start();

}

/* ==================================================
   SUBMIT REPORT
   ================================================== */

async function submitReport() {

    const submitButton =
        document.getElementById("submitButton");

    const submitStatus =
        document.getElementById("submitStatus");

    const issueImage =
        document.getElementById("issueImage").files[0];

    const issueType =
        document.getElementById("issueType").value;

    const description =
        document.getElementById("description").value.trim();

    const location =
        document.getElementById("location").value.trim();

    if (!issueImage) {

        submitStatus.textContent =
            "❌ Please upload an image.";

        return;

    }

    if (!issueType) {

        submitStatus.textContent =
            "❌ Please select an issue type.";

        return;

    }

    if (!description) {

        submitStatus.textContent =
            "❌ Please describe the issue.";

        return;

    }

    if (!location) {

        submitStatus.textContent =
            "❌ Please enter your location.";

        return;

    }

    submitButton.disabled =
        true;

    submitButton.style.opacity =
        "0.6";

    /*
     * FIRST STATUS:
     * SUBMITTED
     */

    submitStatus.textContent =
        "📨 Report Submitted";

    try {

        const formData =
            new FormData();

        formData.append(
            "image",
            issueImage
        );

        formData.append(
            "issueType",
            issueType
        );

        formData.append(
            "description",
            description
        );

        formData.append(
            "location",
            location
        );

        const citizenEmail =
    localStorage.getItem("civicEyeCitizenEmail") ||
    localStorage.getItem("civicEyeEmail") ||
    localStorage.getItem("citizenEmail") ||
    localStorage.getItem("userEmail") ||
    localStorage.getItem("email") ||
    sessionStorage.getItem("civicEyeCitizenEmail") ||
    sessionStorage.getItem("civicEyeEmail") ||
    sessionStorage.getItem("citizenEmail") ||
    sessionStorage.getItem("userEmail") ||
    sessionStorage.getItem("email") ||
    "";

formData.append(
    "citizenEmail",
    citizenEmail.trim().toLowerCase()
);

        /*
         * AI PROCESSING
         */

        submitStatus.textContent =
            "🤖 AI is processing your complaint...";

        const response =
            await fetch(
                `${BACKEND_URL}/upload`,
                {
                    method: "POST",
                    body: formData
                }
            );

        if (!response.ok) {

            throw new Error(
                `Server returned ${response.status}`
            );

        }

        const data =
            await response.json();

        /*
         * GET BACKEND REPORT
         */

        const report =
            data.report || data;

        /*
         * DETECT DUPLICATE FROM ALL
         * SUPPORTED BACKEND FIELDS
         */

        const isDuplicate =
            data.isDuplicate === true ||
            data.duplicate === true ||
            report.isDuplicate === true ||
            report.duplicate === true;

        /*
         * KEEP BOTH FIELD NAMES
         * FOR AI PROCESSING PAGE
         */

        report.isDuplicate =
            isDuplicate;

        report.duplicate =
            isDuplicate;

        /*
         * FIRST STATUS MUST BE
         * SUBMITTED
         */

        report.status =
            "Submitted";

        /*
         * SAVE RESULT
         */

        sessionStorage.setItem(
            "civicEyeReport",
            JSON.stringify(report)
        );

        /*
         * NO ALERT HERE.
         *
         * Duplicate complaint will be shown
         * on ai-processing.html.
         *
         * Both normal and duplicate reports
         * continue to AI processing.
         */

        window.location.href =
            "./ai-processing.html";

    } catch (error) {

        console.error(
            "Submit error:",
            error
        );

        submitStatus.textContent =
            "❌ Backend unavailable. Please try again.";

        submitButton.disabled =
            false;

        submitButton.style.opacity =
            "1";

    }

}

function applyLanguage() {

    const savedLanguage =
        localStorage.getItem("civicEyeLanguage") || "en";

    const t =
        reportTranslations[savedLanguage] ||
        reportTranslations.en;

    const title =
        document.querySelector(".report-container h1");

    if (title)
        title.textContent = t.title;

    const paragraphs =
        document.querySelectorAll(
            ".report-container > .report-card > p"
        );

    if (paragraphs[0])
        paragraphs[0].textContent =
            t.subtitle;

    const labels =
        document.querySelectorAll(
            ".report-container label"
        );

    if (labels[0])
        labels[0].textContent =
            t.uploadLabel;

    if (labels[1])
        labels[1].textContent =
            t.issueTypeLabel;

    if (labels[2])
        labels[2].textContent =
            t.descriptionLabel;

    if (labels[3])
        labels[3].textContent =
            t.voiceLanguageLabel;

    if (labels[4])
        labels[4].textContent =
            t.locationLabel;

    const issueOptions =
        document.querySelectorAll(
            "#issueType option"
        );

    if (issueOptions.length >= 6) {

        issueOptions[1].textContent =
            t.roadDamage;

        issueOptions[2].textContent =
            t.garbageProblem;

        issueOptions[3].textContent =
            t.waterLeakage;

        issueOptions[4].textContent =
            t.streetLight;

        issueOptions[5].textContent =
            t.other;

    }

    const description =
        document.getElementById("description");

    if (description)
        description.placeholder =
            t.descriptionPlaceholder;

    const voiceOptions =
        document.querySelectorAll(
            "#voiceLanguage option"
        );

    if (voiceOptions.length >= 3) {

        voiceOptions[0].textContent =
            t.english;

        voiceOptions[1].textContent =
            t.tamil;

        voiceOptions[2].textContent =
            t.sinhala;

    }

    const voiceButton =
        document.querySelector(
            'button[onclick="startVoiceComplaint()"]'
        );

    if (voiceButton)
        voiceButton.textContent =
            t.voiceButton;

    const voiceStatus =
        document.getElementById("voiceStatus");

    if (voiceStatus)
        voiceStatus.textContent =
            t.voiceReady;

    const locationInput =
        document.getElementById("location");

    if (locationInput)
        locationInput.placeholder =
            t.locationPlaceholder;

    const locationButton =
        document.querySelector(
            'button[onclick="getCurrentLocation()"]'
        );

    if (locationButton)
        locationButton.textContent =
            t.locationButton;

    const submitButton =
        document.getElementById("submitButton");

    if (submitButton)
        submitButton.textContent =
            t.submitButton;


document
    .querySelectorAll("[data-menu-text]")
    .forEach(function(element) {

        const key =
            element.getAttribute("data-menu-text");

       if (
    menuTranslations[savedLanguage] &&
    menuTranslations[savedLanguage][key] !== undefined
) {

    element.textContent =
        menuTranslations[savedLanguage][key];

}

    });




}
